<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
