<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>张恒玮 · 作品集预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f1fc;font-family:system-ui,sans-serif;color:#30598b}header{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #d6e3f5}header>span{font-size:14px;font-weight:600}nav{display:flex;gap:8px}button,a{font:inherit;font-size:13px;border:1px solid #d7e5f6;padding:8px 14px;border-radius:8px;background:white;color:#39689f;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#2563eb;color:white;border-color:#2563eb}main{display:flex;justify-content:center;padding:22px;min-height:calc(100vh - 68px)}iframe{width:100%;height:calc(100vh - 112px);border:1px solid #c9dcf4;border-radius:13px;background:white;box-shadow:0 15px 45px #30598b15}iframe.mobile{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 112px)}@media(max-width:600px){header{padding:0 12px}header>span{font-size:11px}button,a{font-size:11px;padding:8px}main{padding:10px}iframe{height:calc(100vh - 88px)}}:focus-visible{outline:3px solid #397deb;outline-offset:3px}</style></head><body><header><span>张恒玮 · 蓝白作品集</span><nav aria-label="预览尺寸"><button data-view="desktop" aria-pressed="true">桌面</button><button data-view="mobile" aria-pressed="false">手机</button><a href="index.html" target="_blank" rel="noopener">全屏打开 ↗</a></nav></header><main><iframe src="index.html" title="作品集页面预览"></iframe></main><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').classList.toggle('mobile',button.dataset.view==='mobile');document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));</script></body></html>
